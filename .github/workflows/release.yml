name: release

# native-image cannot cross-compile, so every OS/CPU we ship is built on its own runner.
# Pushing a tag publishes the four binaries plus the runnable JAR as release assets.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  native:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux stays off the newest runner so the binary links against an older glibc.
          - os: ubuntu-22.04
            asset: marginx-linux-x64
          - os: macos-13
            asset: marginx-macos-x64
          - os: macos-14
            asset: marginx-macos-arm64
          - os: windows-2022
            asset: marginx-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      # On Windows this action also sets up the MSVC developer environment native-image needs.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'

      - name: Build native image
        shell: bash
        run: ./gradlew nativeCompile

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/native/nativeCompile/marginx.exe "dist/${{ matrix.asset }}"
          else
            cp build/native/nativeCompile/marginx "dist/${{ matrix.asset }}"
            chmod +x "dist/${{ matrix.asset }}"
          fi

      # Confirm the image at least starts before it ships.
      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.asset }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  jar:
    name: marginx-all.jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build fat jar
        run: ./gradlew build
      - name: Stage jar
        run: |
          mkdir -p dist
          cp build/libs/*-all.jar dist/marginx-all.jar
      - uses: actions/upload-artifact@v4
        with:
          name: marginx-all.jar
          path: dist/marginx-all.jar
          if-no-files-found: error

  publish:
    needs: [native, jar]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A hyphenated tag (v0.1.0-rc1) is a pre-release; a bare v0.1.0 is a real one.
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --generate-notes $prerelease
