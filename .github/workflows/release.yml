name: release

# jpackage cannot cross-compile, so each installer is built on the OS it targets.
# Pushing a tag publishes the Windows .msi, the Linux .deb and a portable zip per OS.
# Neither JoSIM nor JSIM is bundled - see docs/adr/0001-distribution-strategy.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  installer:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux stays off the newest runner so the bundled runtime links against an older glibc.
          - os: ubuntu-22.04
            asset: linux-x64
          - os: windows-2022
            asset: windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # jpackage shells out to WiX for the .msi. The app-image build does not need it.
      - name: Install WiX
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y

      # A tag of v0.2.0 ships as version 0.2.0; without this the hardcoded version would be used.
      - name: Resolve version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *) version=0.0.0 ;;
          esac
          echo "MARGINX_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build installer
        shell: bash
        run: ./gradlew jpackage -Pversion="$MARGINX_VERSION"

      - name: Build portable image
        shell: bash
        run: ./gradlew jpackage -Pjpackage.type=app-image -Pversion="$MARGINX_VERSION"

      - name: Stage assets (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/jpackage/deb/*.deb dist/
          (cd build/jpackage/app-image && zip -qr "$GITHUB_WORKSPACE/dist/marginxj-${{ matrix.asset }}-portable.zip" .)

      - name: Stage assets (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/jpackage/msi/*.msi dist/
          Compress-Archive -Path build/jpackage/app-image/* -DestinationPath "dist/marginxj-${{ matrix.asset }}-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [installer]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A hyphenated tag (v0.1.0-rc1) is a pre-release; a bare v0.1.0 is a real one.
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --generate-notes $prerelease
