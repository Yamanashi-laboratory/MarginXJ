# The command-line entry point, added by jpackage as a second launcher.
#
# It exists because the two ways of using MarginXJ want opposite things from Windows: a window
# double-clicked from the start menu should not drag a console along with it, and a command line
# that prints margins is useless without one. Everything else - the main class, the jar, the
# runtime - is inherited from the main application.
win-console=true
description=MarginXJ on the command line

# No shortcuts for this one. It is meant to be typed in a terminal that is already open, and
# double-clicking it only flashes a console reporting the circuit argument it was not given.
win-shortcut=false
win-menu=false
