[versions]
picocli = "4.7.6"
openjfx = "21.0.5"
richtextfx = "0.11.2"
junit = "5.11.4"
assertj = "3.27.3"
archunit = "1.3.0"
openjfx-plugin = "0.1.0"

[libraries]
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
picocli-codegen = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }
richtextfx = { module = "org.fxmisc.richtext:richtextfx", version.ref = "richtextfx" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
openjfx = { id = "org.openjfx.javafxplugin", version.ref = "openjfx-plugin" }
